version: "2"

run:
  timeout: 5m

linters-settings:
  cyclop:
    max-complexity: 11

  promlinter:
    disabled-linters:
      - Counter
      - HistogramSummaryReserved

linters:
  fast: false
  enable-all: true
  disable:
    - dupl
    - gochecknoglobals
    - gochecknoinits
    - lll
    - funlen
    - wsl
    - testpackage
    - godot
    - paralleltest
    - exhaustruct
    - wrapcheck
    - forbidigo
    - tagliatelle
    - nonamedreturns
    - depguard
    - perfsprint
    - mnd
    - promlinter
    - staticcheck

